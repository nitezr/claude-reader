<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* Reader — a reading desk: cool paper, fountain-pen blue for actions, highlighter yellow for anything you mark. */
:root{--bg:#f6f7f4;--s1:#eceee9;--s2:#e1e4dd;--line:#d7dbd2;--text:#16191f;--muted:#545b66;--faint:#868d97;--accent:#2347c6;--accentbg:#e2e8fb;--later:#2347c6;--arch:#1d7f57;--hl:#ffe45c;--hlline:#e8c400;--danger:#b8321f;--shadow:0 10px 40px rgba(20,25,35,.14);--grad2:#4f74f0;--ui:"Schibsted Grotesk",system-ui,sans-serif;--read:"Newsreader",Georgia,serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--s1:#181c22;--s2:#20252c;--line:#2a3039;--text:#e9ecf0;--muted:#a4abb6;--faint:#717985;--accent:#8fa8ff;--accentbg:#1d2747;--later:#4566e0;--arch:#1f9d6b;--hl:#5a4b05;--hlline:#e0c21a;--danger:#ff8a7a;--shadow:0 10px 40px rgba(0,0,0,.5);--grad2:#b9c8ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--s1:#181c22;--s2:#20252c;--line:#2a3039;--text:#e9ecf0;--muted:#a4abb6;--faint:#717985;--accent:#8fa8ff;--accentbg:#1d2747;--later:#4566e0;--arch:#1f9d6b;--hl:#5a4b05;--hlline:#e0c21a;--danger:#ff8a7a;--shadow:0 10px 40px rgba(0,0,0,.5);--grad2:#b9c8ff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--s1);color:var(--muted)}

/* layout */
#side{display:none}
#view{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px 0}
.hd{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.hd h1{font-family:var(--read);font-size:38px;font-weight:600;margin:0;letter-spacing:-.015em;flex:1}
.ibtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.ibtn:hover{background:var(--s1);color:var(--text)}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--faint);min-width:64px}
#tabs button.on{color:var(--text)}

/* home shelves */
.shelf{margin:8px 0 26px}
.shelf h2{font-family:var(--read);font-size:23px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.shelf h2 button{margin-left:auto;font-family:var(--ui);font-size:13px;font-weight:500;color:var(--accent)}
.shelf .sc{display:flex;align-items:flex-start;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none}
.shelf .sc::-webkit-scrollbar{display:none}
.card{flex:none;width:128px;scroll-snap-align:start;text-align:left}
.card .cv{width:128px;height:160px;border-radius:4px}
.card b{display:block;font-size:13.5px;font-weight:600;line-height:1.3;margin-top:8px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card span{display:block;font-size:12px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .pb{height:3px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.card .pb i{display:block;height:100%;background:var(--accent)}

/* cover art */
.cv{position:relative;overflow:hidden;display:grid;place-items:center;color:#fff;font-family:var(--read);font-weight:600}
.cv::before{content:"";position:absolute;width:120%;height:120%;border-radius:50%;left:35%;top:40%;background:var(--c2);opacity:.85}
.cv::after{content:"";position:absolute;width:55%;height:55%;border-radius:50%;left:-12%;top:-14%;background:var(--c3);opacity:.7}
.cv.img::before,.cv.img::after{display:none}
.cv img.full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.cv img.ic{position:relative;z-index:1;width:42%;height:42%;object-fit:contain;border-radius:22%;background:#fff;padding:4%}
.hero{width:100%;aspect-ratio:1.9;object-fit:cover;border-radius:12px;margin:4px 0 22px;background:var(--s1)}
.cv em{position:relative;z-index:1;font-style:normal;text-shadow:0 2px 12px rgba(0,0,0,.25)}

/* library */
.seg{display:flex;gap:4px;background:var(--s1);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:7px 0;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--s2);color:var(--text)}
.seg small{color:var(--faint);font-weight:400;margin-left:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--s1);color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--accentbg);color:var(--accent)}
.queue{font-size:12.5px;color:var(--muted);background:var(--s1);border-radius:8px;padding:8px 12px;margin-bottom:10px}
.row{position:relative;border-bottom:1px solid var(--line);overflow:hidden}
.sw{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-weight:600;color:#fff}
.sw.l{background:var(--arch)}.sw.r{background:var(--later);justify-content:flex-end}
.rin{position:relative;background:var(--bg);display:flex;gap:14px;padding:14px 0 12px;cursor:pointer;transition:transform .2s}
.rin.drag{transition:none}
.row.kb .rin{box-shadow:inset 3px 0 0 var(--accent);padding-left:10px}
.rm{flex:1;min-width:0}
.src{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--muted)}
.fav{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:9.5px;color:#fff;font-style:normal;letter-spacing:0}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.rt{font-family:var(--read);font-weight:600;font-size:18.5px;line-height:1.3;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rs{font-size:13.5px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ra{font-size:12.5px;color:var(--faint);margin-top:6px}
.rth{flex:none;width:64px;height:80px;border-radius:4px;margin-top:22px}
.rth.cv em{font-size:28px}
.more{position:absolute;right:0;top:8px;color:var(--faint);width:28px;height:24px;display:grid;place-items:center}
.prog{height:2px;background:transparent}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--grad2))}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}

/* document */
.dtop{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;gap:4px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;border-bottom:1px solid transparent}
.dtop.stuck{border-bottom-color:var(--line)}
.dtop .tt{flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
.dtop.stuck .tt{opacity:1}
.back{display:flex;align-items:center;gap:2px;padding:6px 10px 6px 4px;border-radius:8px;font-weight:500;color:var(--accent)}
.rbar{position:fixed;top:0;left:0;height:2px;z-index:16;background:linear-gradient(90deg,var(--accent),var(--grad2));width:0}
.doc{display:grid;grid-template-columns:1fr;gap:0}
article{max-width:680px;width:100%;margin:0 auto;padding:12px 22px 40px}
.dsrc{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--muted);margin-top:10px}
.dsrc a{color:inherit;text-decoration:none}
h1.dt{font-family:var(--read);font-size:34px;line-height:1.12;font-weight:600;margin:10px 0 8px;letter-spacing:-.01em}
.by{font-size:13.5px;color:var(--faint);margin-bottom:20px}
.info{background:var(--s1);border-radius:12px;padding:14px 16px;margin-bottom:26px}
.info h4,.panel h4{margin:0 0 6px;font-size:13px;color:var(--faint);font-weight:600}
.info p{margin:0 0 8px;font-size:15px}
.info ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.info li{margin:3px 0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.body{font-family:var(--read);font-size:19px;line-height:1.72}
.body>*{position:relative;scroll-margin:90px}
.body h2{font-size:24px;line-height:1.3;margin:30px 0 10px}
.body h3{font-size:20px;margin:24px 0 8px}
.body p{margin:0 0 18px}
.body blockquote{margin:0 0 18px;padding-left:16px;border-left:3px solid var(--line);color:var(--muted);font-style:italic}
.body li{margin:0 0 10px 22px;display:list-item}
.body pre{font:13.5px/1.55 ui-monospace,Menlo,monospace;background:var(--s1);padding:12px 14px;border-radius:8px;overflow:auto;white-space:pre-wrap}
.body>.pf::before{content:"";position:absolute;left:-14px;top:4px;bottom:4px;width:3px;border-radius:2px;background:var(--accent)}
.body>li.pf::before{left:-36px}
mark{color:inherit;padding:0 2px;margin:0 -1px;border-radius:3px 6px 4px 7px;background:linear-gradient(100deg,transparent 0 2px,var(--hl) 4px calc(100% - 6px),transparent 100%);background-size:100% 78%;background-position:0 70%;background-repeat:no-repeat;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.endnote{color:var(--faint);font-size:13px;text-align:center;padding:24px 0}
.panel{display:none}
.toolbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;align-items:center;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:10px 8px calc(10px + env(safe-area-inset-bottom))}
.toolbar button{width:44px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.toolbar button.on{color:var(--accent);background:var(--accentbg)}
.toolbar .sep{width:1px;height:22px;background:var(--line)}
.hlr{border-left:4px solid var(--hlline);padding:4px 0 4px 12px;margin:0 0 14px}
.hlr q{font-family:var(--read);font-size:15.5px;quotes:none;display:block}
.hlr textarea{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--s1);font-size:13px;resize:vertical}
.hlr .x{font-size:12px;color:var(--danger);margin-top:4px}
.hlr .from{font-size:12px;color:var(--faint);margin-top:4px;display:block;text-align:left}

/* sheet, toast, help, hl button */
#sheet{position:fixed;inset:0;z-index:40;display:none}
#sheet.on{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:80vh;overflow:auto;background:var(--s1);border-radius:16px 16px 0 0;padding:8px 14px calc(16px + env(safe-area-inset-bottom));box-shadow:var(--shadow);max-width:560px;margin:0 auto}
#sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
#sheet h3{margin:0 0 10px;font-size:15px;font-weight:600;padding:0 4px}
.act{display:flex;align-items:center;gap:12px;width:100%;padding:12px 10px;border-radius:10px;text-align:left;background:var(--s2);margin-bottom:6px}
.act.danger{color:var(--danger)}
.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.pbtn{width:100%;padding:11px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13.5px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;white-space:nowrap}
#toast.on{opacity:1}
#hlbtn{position:fixed;display:none;z-index:30;background:var(--text);color:var(--bg);padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
#help{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:60}
#help.on{display:flex}
#help .box{background:var(--s1);border-radius:14px;padding:22px 26px;width:min(560px,92vw);max-height:86vh;overflow:auto;box-shadow:var(--shadow)}
#help h3{margin:0 0 4px}
#help h4{margin:16px 0 6px;font-size:13px;color:var(--faint)}
#help .kr{display:flex;justify-content:space-between;padding:4px 0;font-size:13.5px}
#help .kr span:last-child{display:flex;gap:4px}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--s1);margin-bottom:14px}
.status{font-size:12px;color:var(--faint);text-align:center;padding:16px 0}

/* desktop */
@media (min-width:980px){
  #tabs{display:none}
  #side{display:block;position:fixed;top:0;left:0;bottom:0;width:232px;border-right:1px solid var(--line);background:var(--s1);padding:18px 12px;overflow:auto}
  #view{margin-left:232px;padding-bottom:40px}
  .brand{display:flex;align-items:center;gap:9px;font-family:var(--read);font-weight:700;font-size:21px;padding:2px 8px 18px}
  .brand i{width:22px;height:8px;border-radius:2px 5px 3px 6px;background:var(--hlline);transform:rotate(-4deg)}
  .nh{font-size:12.5px;font-weight:600;color:var(--faint);padding:14px 8px 6px}
  .nv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 8px;border-radius:8px;color:var(--muted);font-size:14px}
  .nv:hover{background:var(--s2)}
  .nv.on{background:var(--s2);color:var(--text);font-weight:500}
  .nv small{margin-left:auto;color:var(--faint);font-size:12px}
  .hint{padding:18px 8px 0;font-size:12px;color:var(--faint)}
  .wrap{padding-top:22px}
  .doc{grid-template-columns:1fr 300px}
  .toolbar{position:sticky;top:0;bottom:auto;border:0;background:none;backdrop-filter:none;justify-content:flex-start;gap:4px;padding:0;margin-left:auto}
  .toolbar .sep{margin:0 4px}
  .dtop{padding:8px 16px}
  .dtop .tt{opacity:1}
  .panel{display:block;position:sticky;top:0;height:100vh;overflow:auto;border-left:1px solid var(--line);padding:20px 18px;background:var(--s1)}
  .panel .ptabs{display:flex;gap:4px;background:var(--s2);border-radius:9px;padding:3px;margin-bottom:16px}
  .panel .ptabs button{flex:1;padding:6px 0;border-radius:7px;font-size:13px;color:var(--muted)}
  .panel .ptabs button.on{background:var(--bg);color:var(--text)}
  .panel p{margin:0 0 10px;font-size:14px}
  .panel ul{padding-left:18px;margin:0 0 14px;color:var(--muted);font-size:13.5px}
  .panel .meta{font-size:13px;color:var(--muted);line-height:1.9}
  .panel .meta a{color:var(--accent);text-decoration:none}
  article .info{display:none}
  article{padding-top:28px}
  h1.dt{font-size:44px}
  #toast{bottom:28px}
  #view.indoc{padding-bottom:0}
}

/* ===== v2: bolder layout ===== */
.hd h1{font-size:clamp(44px,7vw,72px);line-height:.95;letter-spacing:-.025em}
.shelf{margin:14px 0 40px}
.shelf h2{font-size:28px;letter-spacing:-.01em;border-bottom:2px solid var(--text);padding-bottom:8px}
.shelf .sc{gap:22px;padding-top:6px}
.card{width:156px}
.card .cv{width:156px;height:220px;border-radius:2px 6px 6px 2px;box-shadow:inset 6px 0 0 rgba(0,0,0,.22),inset 8px 0 0 rgba(255,255,255,.12),0 10px 22px rgba(20,25,35,.22);transition:transform .15s}
.card:hover .cv{transform:translateY(-4px) rotate(-1deg)}
.card .cv em{font-size:64px}
.card b{font-family:var(--read);font-size:16.5px;line-height:1.2;margin-top:10px}
.card .pb{height:6px;border-radius:3px;margin-top:8px}
.card .pb i,.prog i,.rbar{background:var(--hlline)!important}
.rbar{height:4px}
.rin{padding:18px 0 16px;gap:18px}
.rt{font-size:22px;line-height:1.2;letter-spacing:-.01em}
.rs{font-size:15px}
.rth{width:84px;height:112px;margin-top:4px;border-radius:2px 5px 5px 2px;box-shadow:inset 5px 0 0 rgba(0,0,0,.2)}
.prog{height:4px}
.seg{border-radius:999px;padding:4px}
.seg button{border-radius:999px}
.seg button.on{background:var(--text);color:var(--bg)}
.chip.on{background:var(--hl);color:var(--text)}
h1.dt{font-size:clamp(36px,5vw,56px);line-height:1.04;letter-spacing:-.02em}
.body{font-size:20.5px;line-height:1.75}
#tabs{left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));border:0;border-radius:22px;background:#16191f;color:#e9ecf0;padding:8px 6px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
#tabs button{color:#8a929e}
#tabs button.on{color:#16191f;background:var(--hl);border-radius:14px;padding:4px 0}
.toolbar{left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));border:0;border-radius:22px;background:#16191f;color:#e9ecf0}
@media (min-width:980px){
  #side{background:#16191f;color:#e9ecf0;border-right:0}
  .brand{color:#fff;font-size:26px}
  .nv{color:#a4abb6;font-size:15px;padding:9px 10px}
  .nv:hover{background:#232830;color:#fff}
  .nv.on{background:var(--hl);color:#16191f;font-weight:600}
  .nv.on small{color:#16191f}
  .nh,.hint{color:#717985}
  .hint kbd{background:#232830;border-color:#2f3540;color:#a4abb6}
  .toolbar{position:sticky;left:auto;right:auto;bottom:auto;background:none;color:inherit;border-radius:0}
  .panel{background:var(--bg)}
}
</style>
</head>
<body>
<nav id="side"></nav>
<div id="view"></div>
<nav id="tabs"></nav>
<div class="rbar" id="rbar"></div>
<div id="sheet"><div class="bd"></div><div class="pn" id="pn"></div></div>
<button id="hlbtn">Highlight <kbd>H</kbd></button>
<div id="toast"></div>
<div id="help"><div class="box" id="helpbox"></div></div>
<script>
/* ---------- icons ---------- */
const IC={
home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
library:'<path d="M4 4h4v16H4zM10 4h4v16h-4zM16.5 4.5l3.5 1-4 15-3.5-1z"/>',
highlight:'<path d="m9 15 6-6 3 3-6 6H9z"/><path d="m15 9 2-2 3 3-2 2"/><path d="M4 21h16"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
inbox:'<path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5 5h14l2 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"/>',
later:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',

  if(S.para<0){const ch=[...b.children];const i=ch.findIndex(c=>c.getBoundingClientRect().top>70);S.para=Math.max(0,i<0?max:i)}else S.para=Math.min(max,Math.max(0,S.para+n));
  paint();b.children[S.para].scrollIntoView({block:"nearest",behavior:"smooth"})}
function hlPara(){const b=$("body");const d=cur();if(!b||S.para<0||!d||!db)return false;const t=(b.children[S.para].textContent||"").replace(/\s+/g," ").trim();if(t.length<3)return false;
  if(S.hls.some(h=>h.docId===d.id&&h.text===t)){toast("Already highlighted");return true}
  db.collection("highlights").add({docId:d.id,text:t,note:"",createdAt:new Date().toISOString()}).then(()=>toast("Highlighted"),()=>toast("Couldn't save highlight"));return true}
function hlAction(){if($("hlbtn").style.display==="block"){$("hlbtn").click();return}if(hlPara())return;toast(isDesk()?"Select text, or press ↓ then H":"Select some text first")}

/* ---------- actions ---------- */
function move(d,l){if(!d)return;if(loc(d)===l){toast("Already in "+l[0].toUpperCase()+l.slice(1));return}upd(d.id,{location:l});toast("Moved to "+l[0].toUpperCase()+l.slice(1))}
function moveCur(l){const d=cur();if(!d)return;const was=loc(d);move(d,l);if(was!==l&&l!=="inbox"){setTimeout(goBack,250)}}
function sheet(title,...kids){$("pn").replaceChildren(el("div",{class:"grab"}),title?el("h3",{},title):null,...kids);$("sheet").classList.add("on")}
function closeSheet(){$("sheet").classList.remove("on")}
document.querySelector("#sheet .bd").addEventListener("click",closeSheet);
function actSheet(d){const a=(ic,l,fn,cls)=>el("button",{class:"act"+(cls?" "+cls:""),onclick:()=>{fn();if(!cls||cls!=="danger")closeSheet()}},icon(ic),l);
  let armed=false;const del=el("button",{class:"act danger",onclick:()=>{if(!armed){armed=true;del.lastChild.textContent="Tap again to delete for good";return}db.doc("docs/"+d.id).delete().then(()=>{toast("Deleted");closeSheet();if(S.r.v==="doc")goBack()},()=>toast("Couldn't delete"))}},icon("trash"),el("span",{},"Delete"));
  sheet(d.title,a("inbox","Move to Inbox",()=>move(d,"inbox")),a("later","Move to Later",()=>move(d,"later")),a("archive","Archive",()=>move(d,"archive")),
    a("star",d.fav?"Remove from Shortlist":"Add to Shortlist",()=>{upd(d.id,{fav:!d.fav});toast(d.fav?"Removed from Shortlist":"Added to Shortlist")}),
    d.progress>0?a("later","Mark as unread",()=>upd(d.id,{progress:0})):null,
    d.url?el("a",{class:"act",href:d.url,target:"_blank",rel:"noopener",style:"text-decoration:none",onclick:closeSheet},icon("ext"),"Open original"):null,
    d.url?a("link","Copy link",()=>copy(d.url)):null,!isDesk()&&S.r.v==="doc"?a("info","Summary & details",()=>setTimeout(()=>infoSheet(d),50)):null,del)}
function infoSheet(d){sheet("Summary",d.summary?el("p",{style:"margin:0 4px 10px"},d.summary):null,(d.keyPoints||[]).length?el("ul",{style:"margin:0 0 10px;color:var(--muted)"},...d.keyPoints.map(k=>el("li",{},k))):null)}
function notesSheet(d){const hls=S.hls.filter(h=>h.docId===d.id);sheet("Notebook ("+hls.length+")",...(hls.length?hls.map(h=>hlItem(h)):[el("p",{style:"color:var(--muted);margin:0 4px 8px"},"Select any text in the article, then tap Highlight.")]))}
function copy(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast("Link copied"),()=>toast("Couldn't copy"));else toast("Couldn't copy")}
function addSheet(){const inp=el("input",{class:"field",placeholder:"https://…",inputmode:"url",autocomplete:"off"});
  const f=el("form",{onsubmit:async e=>{e.preventDefault();const u=inp.value.trim();if(!/^https?:\/\//i.test(u)){toast("That doesn't look like a link");return}
    if(!db){toast("Storage isn't available here");return}try{await db.collection("queue").add({url:u,addedAt:new Date().toISOString(),status:"pending"});closeSheet();toast("Queued for Claude")}catch(err){toast("Couldn't queue")}}},
    inp,el("button",{class:"pbtn"},"Add to queue"),el("p",{style:"color:var(--muted);font-size:13px;margin:10px 4px 0"},"Claude saves queued links when you ask it to “process my Reader queue”. Or just send links in chat."));
  sheet("Save a link",f);setTimeout(()=>inp.focus(),50)}

const btn=$("hlbtn");let pending="";
document.addEventListener("selectionchange",()=>{const s=document.getSelection();const b=$("body");
  if(!s||s.isCollapsed||!b||!b.contains(s.anchorNode)){btn.style.display="none";return}
  const t=s.toString().replace(/\s+/g," ").trim();if(t.length<3){btn.style.display="none";return}
  pending=t;const r=s.getRangeAt(0).getBoundingClientRect();btn.style.left=Math.max(8,Math.min(innerWidth-120,r.left+r.width/2-50))+"px";btn.style.top=(r.top>60?r.top-44:r.bottom+10)+"px";btn.style.display="block"});
btn.addEventListener("mousedown",e=>e.preventDefault());
btn.addEventListener("click",async()=>{btn.style.display="none";const d=cur();if(!pending||!d||!db)return;
  try{await db.collection("highlights").add({docId:d.id,text:pending,note:"",createdAt:new Date().toISOString()});document.getSelection().removeAllRanges();toast("Highlighted")}catch(e){toast("Couldn't save highlight")}});
document.addEventListener("mousedown",e=>{const b=$("body");if(b&&b.contains(e.target)){const i=[...b.children].findIndex(c=>c.contains(e.target));if(i>=0){S.para=i;paint()}}});

const KEYS=[["In a list",[["Next / previous item",["↓","↑"]],["Also",["J","K"]],["Open",["Enter"]]]],

$("helpbox").replaceChildren(el("h3",{},"Keyboard shortcuts"),...KEYS.flatMap(([h,rows])=>[el("h4",{},h),...rows.map(([l,ks])=>el("div",{class:"kr"},el("span",{},l),el("span",{},...ks.map(k=>el("kbd",{},k)))))]));

function stepList(n){const a=visible();if(!a.length)return;S.cur=S.cur<0?(n>0?0:a.length-1):Math.min(a.length-1,Math.max(0,S.cur+n));
  document.querySelectorAll("#rows .row").forEach((r,i)=>r.classList.toggle("kb",i===S.cur));const r=document.querySelectorAll("#rows .row")[S.cur];if(r)r.scrollIntoView({block:"nearest",behavior:"smooth"})}
function target(){if(S.r.v==="doc")return cur();const a=visible();return S.cur>=0?a[S.cur]:null}
let gP=false,gT;
document.addEventListener("keydown",e=>{const tg=(e.target.tagName||"").toLowerCase();const typing=tg==="input"||tg==="textarea"||e.target.isContentEditable;
  if(e.key==="Escape"){if($("help").classList.contains("on")){$("help").classList.remove("on");return}if($("sheet").classList.contains("on")){closeSheet();return}
    if(typing){e.target.blur();return}if(S.r.v==="doc")goBack();return}
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(gP){gP=false;clearTimeout(gT);const m={h:"home",i:"library-inbox",l:"library-later",a:"library-archive",n:"highlights"}[k.toLowerCase()];if(m){e.preventDefault();S.filter=null;go(m)}return}
  const inDoc=S.r.v==="doc";const d=target();
  switch(k){
    case"ArrowDown":case"j":e.preventDefault();inDoc?para(1):stepList(1);break;
    case"ArrowUp":case"k":e.preventDefault();inDoc?para(-1):stepList(-1);break;
    case"Enter":if(!inDoc&&d){e.preventDefault();go("d-"+d.id)}break;
    case" ":if(inDoc){e.preventDefault();scrollBy({top:(e.shiftKey?-1:1)*innerHeight*.85,behavior:"smooth"})}break;
    case"e":if(d){inDoc?moveCur("archive"):move(d,"archive")}break;
    case"l":if(d){inDoc?moveCur("later"):move(d,"later")}break;
    case"i":if(d){inDoc?moveCur("inbox"):move(d,"inbox")}break;
    case"s":if(d){upd(d.id,{fav:!d.fav});toast(d.fav?"Removed from Shortlist":"Added to Shortlist")}break;
    case"o":if(d&&d.url){const a=el("a",{href:d.url,target:"_blank",rel:"noopener"});document.body.append(a);a.click();a.remove()}break;
    case".":if(d)actSheet(d);break;
    case"h":if(inDoc)hlAction();break;
    case"n":if(inDoc){const dd=cur();if(isDesk()){S.ptab=S.ptab==="notes"?"info":"notes";renderDoc()}else notesSheet(dd)}break;
    case"/":e.preventDefault();go("search");break;
    case"a":e.preventDefault();addSheet();break;
    case"g":gP=true;gT=setTimeout(()=>gP=false,1200);break;
    case"?":$("help").classList.toggle("on");break;
  }});

/* ---------- demo mode: a tiny local database when not running inside claude.ai ---------- */
function localDb(){
  const KEY="reader-demo-v1"; let mem=null;
  try{ mem=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){}
  if(!mem){ mem={docs:{},highlights:{},queue:{}}; SAMPLE_DOCS.forEach(d=>mem.docs[d.id]=d); SAMPLE_HLS.forEach(h=>mem.highlights[h.id]=h); }
  const subs={}, persist=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(mem)); }catch(e){} };
  const snap=(n,ord)=>{ let a=Object.entries(mem[n]||{}); if(ord) a.sort((x,y)=>String(y[1][ord]||"").localeCompare(String(x[1][ord]||""))); return {metadata:{fromCache:false},docs:a.map(([id,v])=>({id,exists:true,data:()=>v}))}; };
  const emit=n=>(subs[n]||[]).forEach(([cb,ord])=>cb(snap(n,ord)));
  const docRef=(n,id)=>({
    set:async v=>{(mem[n]=mem[n]||{})[id]=v;persist();emit(n);},
    update:async v=>{(mem[n]=mem[n]||{})[id]={...(mem[n][id]||{}),...v};persist();emit(n);},
    delete:async()=>{if(mem[n])delete mem[n][id];persist();emit(n);}});
  const coll=(n,ord)=>({doc:id=>docRef(n,id),add:async v=>docRef(n,"x"+Date.now().toString(36)).set(v),
    orderBy:f=>coll(n,f),onSnapshot:cb=>{(subs[n]=subs[n]||[]).push([cb,ord]);setTimeout(()=>cb(snap(n,ord)));}});
  return {local:true,collection:n=>coll(n),doc:path=>{const [n,id]=path.split("/");return docRef(n,id);}};
}
let seeded=false;
function seedIfEmpty(s){
  if(seeded||db.local||s.metadata.fromCache||s.docs.length) return; seeded=true;
  SAMPLE_DOCS.forEach(d=>db.collection("docs").doc(d.id).set(d).catch(()=>{}));
  SAMPLE_HLS.forEach(h=>db.collection("highlights").doc(h.id).set(h).catch(()=>{}));
}
(async()=>{
  S.r=parse();if(S.r.v!=="doc")S.lastList=key(S.r);render();

  if(!db){db=localDb();setTimeout(()=>toast("Demo mode: saved in this browser only"),400)}
  const t=setTimeout(()=>{const s=$("status");if(s)s.textContent="Can't reach your library yet — still trying."},10000);
  let first=true;
  db.collection("docs").orderBy("savedAt","desc").onSnapshot(s=>{seedIfEmpty(s);if(!s.metadata.fromCache){clearTimeout(t);S.loaded=true}S.docs=s.docs.map(x=>({id:x.id,...x.data()}));
    if(first&&S.r.v==="doc"){first=false;route();return}first=false;rerender()},e=>{clearTimeout(t);S.loaded=true;toast("Library unavailable ("+e.code+")")});
  db.collection("highlights").onSnapshot(s=>{S.hls=s.docs.map(x=>({id:x.id,...x.data()}));if(S.r.v==="doc"||S.r.v==="highlights")rerender();else renderSide()},()=>{});
  db.collection("queue").onSnapshot(s=>{S.queue=s.docs.map(x=>({id:x.id,...x.data()}));if(S.r.v==="home"||S.r.v==="library")rerender()},()=>{});
})();
